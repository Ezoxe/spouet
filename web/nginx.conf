server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SSE — désactiver le buffering pour le streaming
    location /sse/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # REST API + endpoints SSE streamés (chat).
    # Le chat utilise POST /api/conversations/{id}/messages en SSE et peut
    # rester silencieux >60s pendant le prompt processing d'un LLM lent
    # (CPU, long contexte). Sans `proxy_buffering off` + `proxy_read_timeout`
    # élevé, nginx ferme la connexion → côté client ERR_INCOMPLETE_CHUNKED_ENCODING.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback (PWA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

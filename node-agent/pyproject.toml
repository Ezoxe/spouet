[project]
name = "spouet-node-agent"
version = "0.1.0"
description = "Heartbeat agent for Ollama machines (sends VRAM, models, GPU stats to Spouet backend)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.13",
]

[project.scripts]
spouet-agent = "spouet_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spouet_agent"]

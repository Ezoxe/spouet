[project]
name = "spouet-node-agent"
version = "0.2.0"
description = "Heartbeat + control agent for llama.cpp-server machines (sends hardware stats and manages llama.cpp lifecycle)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface-hub>=0.24",
    "psutil>=6.0",
]

[project.scripts]
spouet-agent = "spouet_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spouet_agent"]

[project]
name = "spouet-voice-engine"
version = "0.1.0"
description = "Microservice STT (faster-whisper) + TTS (Piper) pour Spouet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "piper-tts==1.2.0",
    "huggingface-hub>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_engine"]

[tool.ruff]
line-length = 100

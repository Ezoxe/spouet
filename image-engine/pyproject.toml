[project]
name = "spouet-image-engine"
version = "0.1.0"
description = "Microservice de génération d'images (diffusers / Stable Diffusion) pour Spouet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "torch>=2.2",
    "pillow>=10.0",
    "huggingface-hub>=0.24",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_engine"]

[tool.ruff]
line-length = 100

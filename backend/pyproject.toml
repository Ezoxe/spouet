[project]
name = "spouet"
version = "0.1.0"
description = "Plateforme self-hosted d'orchestration multi-nodes Ollama"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "ollama>=0.4",
    "docker>=7.1",
    "jsonschema>=4.23",
    "PyYAML>=6.0",
    "python-multipart>=0.0.12",
    "typer>=0.13",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "tokenizers>=0.20",
    "pypdf>=5.1",
    "markdown-it-py>=3.0",
    "cryptography>=43.0",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
spouet-admin = "spouet.cli.admin:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spouet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

name: spouet

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${SPOUET_POSTGRES_PORT:-10000}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1"]
    ports:
      - "${SPOUET_REDIS_PORT:-10001}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Moteur voix self-hosted : STT (faster-whisper) + TTS (Piper).
  # Non exposé au LAN (pas de `ports`), seul le backend l'appelle en interne.
  voice-engine:
    build:
      context: ../voice-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${SPOUET_WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${SPOUET_WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${SPOUET_WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${SPOUET_VOICE_LANGUAGE:-fr}
      PIPER_VOICE: ${SPOUET_PIPER_VOICE:-fr_FR-siwis-medium}
    volumes:
      - ./data/voice:/data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Génération d'images self-hosted (diffusers / Stable Diffusion).
  # Non exposé au LAN (pas de `ports`) : seul le backend l'appelle en interne
  # (spouet.images.client). Device auto-détecté (cuda si dispo, sinon cpu).
  image-engine:
    build:
      context: ../image-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Vide => auto (device détecté, modèle adapté). Cf. image-engine/README.md.
      IMAGE_DEVICE: ${SPOUET_IMAGE_DEVICE:-}
      IMAGE_MODEL: ${SPOUET_IMAGE_MODEL:-}
      IMAGE_DTYPE: ${SPOUET_IMAGE_DTYPE:-}
      MODELS_PRELOAD: ${SPOUET_IMAGE_PRELOAD:-1}
    volumes:
      # Cache des poids HF (premier démarrage = téléchargement du modèle).
      - ./data/image-models:/data
    expose:
      - "8002"
    # GPU NVIDIA (optionnel) : installer le NVIDIA Container Toolkit sur l'hôte
    # puis décommenter pour exploiter le GPU (sinon CPU, lent).
    # gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Généreux : le 1er démarrage télécharge les poids du modèle (plusieurs Go).
      start_period: 300s

  # Recherche web self-hosted (méta-moteur SearXNG). Jamais exposé au LAN
  # (pas de `ports`) : seul le backend l'appelle en interne (spouet.websearch).
  # La sortie JSON est activée dans deploy/searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-spouet-searxng-secret}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    expose:
      - "8080"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SPOUET_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPOUET_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../tools:/app/tools:ro
      # PNG générés par image-engine, servis via /api/images/{id}/file.
      - ./data/images:/data/images
    ports:
      - "${SPOUET_BACKEND_PORT:-10002}:8000"
    command: ["uvicorn", "spouet.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SPOUET_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPOUET_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../tools:/app/tools:ro
      # Les jobs planifiés peuvent générer des images (tool generate_image) :
      # même volume que le backend pour que les PNG soient servis ensuite.
      - ./data/images:/data/images
    command: ["celery", "-A", "spouet.workers", "worker", "--loglevel=info", "--concurrency=4"]

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SPOUET_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPOUET_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "spouet.workers", "beat", "--loglevel=info"]

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SPOUET_WEB_PORT:-10003}:80"
    depends_on:
      backend:
        condition: service_healthy
